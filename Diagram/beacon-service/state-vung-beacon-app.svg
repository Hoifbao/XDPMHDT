<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="as" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#000"/></marker><marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000001"/></marker></defs><text x="480.0" y="30" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111" font-weight="bold">State Machine – Vùng beacon trên App (chống báo trùng)</text>
<circle cx="200" cy="110" r="9" fill="#000"/>
<rect x="100" y="200" width="200" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="200.0" y="234.0" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">Ngoài vùng</text>
<path d="M200,119 L200,200" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="640" y="200" width="220" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="750.0" y="226.5" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">Trong vùng</text>
<text x="750.0" y="241.5" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">(đã mở / đã báo hiện vật)</text>
<rect x="370" y="400" width="200" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="470.0" y="426.5" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">Chờ hết cooldown</text>
<text x="470.0" y="441.5" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#111">(60 giây)</text>
<path d="M300,215 L640,215" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
<text x="310" y="180" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">RSSI_tb ≥ -75 dBm [đã qua 60 giây]</text>
<text x="310" y="194" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">/ mở chi tiết hoặc local notification</text>
<path d="M640,245 L300,245" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
<text x="310" y="270" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">RSSI_tb ≤ -85 dBm hoặc mất tín hiệu &gt; 10 giây</text>
<text x="310" y="284" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">/ POST /api/me/visits</text>
<path d="M250,260 L250,420 L370,420" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
<text x="260" y="345" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">RSSI_tb ≥ -75 dBm</text>
<text x="260" y="359" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">[chưa qua 60 giây]</text>
<path d="M370,450 L150,450 L150,260" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
<text x="160" y="470" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">RSSI_tb ≤ -85 dBm</text>
<path d="M570,430 L750,430 L750,260" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
<text x="760" y="345" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">hết 60 giây,</text>
<text x="760" y="359" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#222">vẫn trong vùng</text>
<path d="M100,500 L850,500 L860,510 L860,540 L100,540 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
<text x="108" y="516" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start" fill="#111">Khoảng -75 … -85 dBm là vùng trễ (hysteresis): giữ nguyên trạng thái, tránh nhấp nháy vào/ra.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>