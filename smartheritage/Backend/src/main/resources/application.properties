spring.application.name=smart-heritage-backend
server.port=8080

# Kết nối tới MySQL chạy trên Docker (cổng 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/smart_heritage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo/cập nhật bảng từ các class @Entity của nhóm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Redis cho Phú test
spring.data.redis.host=localhost
spring.data.redis.port=6379
