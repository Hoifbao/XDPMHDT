<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý iBeacon - Smart Heritage</title>
    <link rel="stylesheet" href="../../theme.css">
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="brand">
                <div class="mark">SH</div>
                <span>Smart Heritage</span>
            </div>
            <span class="pill">Dữ liệu mẫu</span>
        </div>

        <div class="panel-title fb-head">
            <div>
                <div class="eyebrow">Hạ tầng</div>
                <h1 class="fb-title">Quản lý iBeacon</h1>
            </div>
            <button type="button" class="btn">+ Thêm iBeacon</button>
        </div>

        <div class="dashboard-grid">
            <div class="card stat">
                <strong id="stat-total">0</strong>
                <span class="muted">Tổng thiết bị</span>
            </div>
            <div class="card stat">
                <strong id="stat-active">0</strong>
                <span class="muted">Đang hoạt động</span>
            </div>
            <div class="card stat">
                <strong id="stat-unassigned">0</strong>
                <span class="muted">Chưa gán hiện vật</span>
            </div>
            <div class="card stat">
                <strong id="stat-inactive">0</strong>
                <span class="muted">Không hoạt động</span>
            </div>
        </div>

        <div class="card fb-section">
            <div class="panel-title fb-list-head">
                <h2>Danh sách thiết bị</h2>
                <div class="nav" id="filter-bar">
                    <button type="button" class="active" data-filter="ALL" aria-pressed="true">Tất cả</button>
                    <button type="button" data-filter="ACTIVE" aria-pressed="false">Đang hoạt động</button>
                    <button type="button" data-filter="INACTIVE" aria-pressed="false">Không hoạt động</button>
                </div>
            </div>

            <div class="fb-table-wrap">
                <table class="table" id="beacon-table">
                    <thead>
                        <tr>
                            <th>UUID</th>
                            <th>Major</th>
                            <th>Minor</th>
                            <th>Hiện vật</th>
                            <th>Trạng thái</th>
                            <th>Cập nhật</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="beacon-body"></tbody>
                </table>
            </div>

            <div class="fb-empty muted" id="beacon-empty" hidden>
                Không có thiết bị nào ở trạng thái này.
            </div>
        </div>
    </div>

    <script src="./ibeacons.js"></script>
</body>
</html>
