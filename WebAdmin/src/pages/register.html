<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Smart Heritage</title>
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="brand">
                <div class="mark">SH</div>
                <span>Smart Heritage</span>
            </div>
            <a href="login.html">Đăng nhập</a>
        </div>

        <div class="auth-wrap">
            <div class="card auth-card">
                <div class="eyebrow">Tạo tài khoản</div>
                <h1>Đăng ký</h1>
                <p class="muted">Tài khoản mới có vai trò mặc định là VISITOR.</p>

                <form class="auth-form" id="register-form" novalidate>
                    <label>Họ và tên
                        <input id="fullName" name="fullName" autocomplete="name">
                    </label>
                    <label>Email
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </label>
                    <label>Tên đăng nhập
                        <input id="username" name="username" autocomplete="username" maxlength="50" required>
                    </label>
                    <label>Mật khẩu
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
                    </label>
                    <label>Nhập lại mật khẩu
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
                    </label>
                    <div class="auth-msg" id="msg" role="alert"></div>
                    <button class="btn" type="submit" id="submit">Đăng ký</button>
                </form>

                <div class="auth-switch">
                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../api/auth.js"></script>
    <script>
        (function () {
            const form = document.getElementById('register-form');
            const msg = document.getElementById('msg');
            const submit = document.getElementById('submit');
            const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function showError(text) {
                msg.className = 'auth-msg error';
                msg.textContent = text;
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const fullName = form.fullName.value;
                const email = form.email.value.trim();
                const username = form.username.value.trim();
                const password = form.password.value;
                const confirm = form.confirm.value;

                // Kiểm tra phía client (Backend cũng kiểm tra lại)
                if (!email || !username || !password) return showError('Vui lòng nhập đầy đủ email, tên đăng nhập và mật khẩu!');
                if (!EMAIL_RE.test(email)) return showError('Email không hợp lệ!');
                if (password.length < 6) return showError('Mật khẩu phải có ít nhất 6 ký tự!');
                if (password !== confirm) return showError('Mật khẩu nhập lại không khớp!');

                submit.disabled = true;
                submit.textContent = 'Đang đăng ký...';
                msg.textContent = '';

                const result = await SHAuth.register(username, email, password, fullName);

                if (result.error) {
                    showError(result.error);
                    submit.disabled = false;
                    submit.textContent = 'Đăng ký';
                    return;
                }
                window.location.replace('login.html?username=' + encodeURIComponent(username));
            });
        })();
    </script>
</body>
</html>
