<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Heritage</title>
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="brand">
                <div class="mark">SH</div>
                <span>Smart Heritage</span>
            </div>
            <a href="../../admin.html">Bảng quản trị</a>
        </div>

        <div class="auth-wrap">
            <div class="card auth-card">
                <div class="eyebrow">Web Admin</div>
                <h1>Đăng nhập</h1>
                <p class="muted">Đăng nhập bằng tài khoản Smart Heritage.</p>

                <form class="auth-form" id="login-form" novalidate>
                    <label>Tên đăng nhập
                        <input id="username" name="username" autocomplete="username" required>
                    </label>
                    <label>Mật khẩu
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </label>
                    <div class="auth-msg" id="msg" role="alert"></div>
                    <button class="btn" type="submit" id="submit">Đăng nhập</button>
                </form>

                <div class="auth-switch">
                    Chưa có tài khoản? <a href="register.html">Đăng ký</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../api/auth.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const reason = params.get('reason');
            const current = SHAuth.currentUser();

            // ADMIN: về trang quản trị (hoặc trang đang mở dở). Du khách: về trang Hồ sơ.
            function goNext(user) {
                window.location.replace(user && user.role === 'ADMIN' ? SHAuth.nextUrl() : 'profile.html');
            }

            // Đã đăng nhập thì chuyển đi luôn, trừ khi vừa bị chặn vì không đủ quyền
            if (current && reason !== 'forbidden') {
                goNext(current);
                return;
            }

            const form = document.getElementById('login-form');
            const msg = document.getElementById('msg');
            const submit = document.getElementById('submit');

            // Điền sẵn username sau khi đăng ký
            const preset = new URLSearchParams(window.location.search).get('username');
            if (preset) {
                document.getElementById('username').value = preset;
                msg.className = 'auth-msg ok';
                msg.textContent = 'Đăng ký thành công! Mời bạn đăng nhập.';
            }

            // Lý do bị chuyển về trang đăng nhập (route guard trong auth.js)
            const REASONS = {
                login: 'Vui lòng đăng nhập để tiếp tục.',
                expired: 'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.',
                forbidden: 'Tài khoản hiện tại không có quyền quản trị. Vui lòng đăng nhập bằng tài khoản ADMIN.',
            };
            if (!preset && REASONS[reason]) {
                msg.className = 'auth-msg error';
                msg.textContent = REASONS[reason];
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const username = form.username.value.trim();
                const password = form.password.value;

                if (!username || !password) {
                    msg.className = 'auth-msg error';
                    msg.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu!';
                    return;
                }

                submit.disabled = true;
                submit.textContent = 'Đang đăng nhập...';
                msg.textContent = '';

                const result = await SHAuth.login(username, password);

                if (result.error) {
                    msg.className = 'auth-msg error';
                    msg.textContent = result.error;
                    submit.disabled = false;
                    submit.textContent = 'Đăng nhập';
                    return;
                }
                if (result.role !== 'ADMIN' && params.get('next')) {
                    // Du khách cố vào trang quản trị: báo rõ thay vì quay vòng về login
                    msg.className = 'auth-msg error';
                    msg.textContent = REASONS.forbidden;
                    submit.disabled = false;
                    submit.textContent = 'Đăng nhập';
                    return;
                }
                goNext(result);
            });
        })();
    </script>
</body>
</html>
