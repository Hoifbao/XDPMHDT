<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Heritage</title>
    <link rel="stylesheet" href="theme.css">
    <!-- Bảo W3: chưa đăng nhập hoặc không phải ADMIN thì chuyển về login.html; tự gắn JWT cho fetch() -->
    <script src="src/api/auth.js" data-guard="admin"></script>
    <!--
        Bảo W7: trước đây trang này là bản prototype với số liệu gõ cứng (1 khách, 2 tương tác, 4.0...).
        Nay admin.html chỉ là điểm vào sau đăng nhập (auth.js chuyển ADMIN về đây) và chuyển thẳng
        sang Dashboard thống kê có số liệu thật. Menu chung: src/components/admin-nav.js.
    -->
    <script>
        if (window.SHAuth && window.SHAuth.isAdmin()) {
            window.location.replace('src/pages/dashboard.html' + window.location.search);
        }
    </script>
</head>
<body>
    <div class="shell">
        <p class="muted">Đang mở Dashboard... Nếu trang không tự chuyển, bấm
            <a href="src/pages/dashboard.html">vào đây</a>.</p>
    </div>
</body>
</html>
