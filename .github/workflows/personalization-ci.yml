name: Personalization service CI

on:
  push:
    branches:
      - feature/phu-w5-personalization
  pull_request:
    paths:
      - 'services/personalization-service/**'
      - 'services/common/**'
      - 'pom.xml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test personalization-service
        run: mvn -B -pl services/personalization-service -am test
      - name: Package personalization-service
        run: mvn -B -pl services/personalization-service -am -DskipTests package
