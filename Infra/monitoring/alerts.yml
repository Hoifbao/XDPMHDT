# Quy tắc cảnh báo Prometheus (Bảo - Sprint 5).
# Xem: http://localhost:9090/alerts  (Inactive -> Pending -> Firing)
# Prometheus tính các quy tắc này mỗi 15 giây (evaluation_interval trong prometheus.yml).
# Kiểm tra cú pháp: docker run --rm -v ${PWD}/Infra/monitoring:/m --entrypoint promtool prom/prometheus:v2.54.1 check rules /m/alerts.yml
groups:
  - name: smart-heritage-availability
    rules:
      # Chỉ báo service ĐANG CHẠY rồi bị chết (trong 10 phút gần nhất có lúc UP).
      # Service không bật từ đầu (ví dụ beacon khi demo 3 service) sẽ không báo, tránh nhiễu.
      - alert: ServiceDown
        expr: up{job="smart-heritage"} == 0 and max_over_time(up{job="smart-heritage"}[10m]) == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} không phản hồi"
          description: "Prometheus không đọc được /actuator/prometheus của {{ $labels.service }} ({{ $labels.instance }}) liên tục hơn 30 giây."

      - alert: MySQLDown
        expr: mysql_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MySQL không kết nối được"
          description: "mysql-exporter báo mysql_up = 0 hơn 30 giây."

      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis không kết nối được"
          description: "redis-exporter báo redis_up = 0 hơn 30 giây."

  - name: smart-heritage-http
    rules:
      # Tỷ lệ lỗi 5xx > 5% trong 1 phút, chỉ tính khi có traffic (> 0.2 request/giây).
      - alert: HighErrorRate5xx
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{job="smart-heritage", uri!~"/actuator.*", status=~"5.."}[1m]))
            /
            clamp_min(sum by (service) (rate(http_server_requests_seconds_count{job="smart-heritage", uri!~"/actuator.*"}[1m])), 1e-9)
          ) > 0.05
          and
          sum by (service) (rate(http_server_requests_seconds_count{job="smart-heritage", uri!~"/actuator.*"}[1m])) > 0.2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} lỗi 5xx {{ $value | humanizePercentage }}"
          description: "Hơn 5% request của {{ $labels.service }} trả lỗi 5xx trong 1 phút gần nhất."

      # Độ trễ p95 > 500 ms trong 1 phút (yêu cầu phi chức năng của nhóm là < 2 giây; 500 ms là ngưỡng cảnh báo sớm).
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_server_requests_seconds_bucket{job="smart-heritage", uri!~"/actuator.*"}[1m]))
          ) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} chậm: p95 = {{ $value | humanizeDuration }}"
          description: "95% request của {{ $labels.service }} mất hơn 500 ms trong 1 phút gần nhất."
