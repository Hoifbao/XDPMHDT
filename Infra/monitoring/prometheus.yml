# Prometheus (Bảo - Sprint 4): mở http://localhost:9090 -> Status -> Targets.
# host.docker.internal = máy của bạn, nên đọc được cả service chạy bằng mvn spring-boot:run
# lẫn service chạy trong Docker (vì Docker mở cổng ra máy).
# Service chưa chạy sẽ hiện DOWN - bình thường.
# Job mysql/redis chỉ UP khi bật profile monitoring (có mysql-exporter, redis-exporter).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Quy tắc cảnh báo (Bảo - Sprint 5): http://localhost:9090/alerts
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: smart-heritage
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels: { service: api-gateway }
      - targets: ['host.docker.internal:8081']
        labels: { service: auth-service }
      - targets: ['host.docker.internal:8082']
        labels: { service: site-service }
      - targets: ['host.docker.internal:8083']
        labels: { service: content-service }
      - targets: ['host.docker.internal:8084']
        labels: { service: beacon-service }
      - targets: ['host.docker.internal:8085']
        labels: { service: personalization-service }
      - targets: ['host.docker.internal:8086']
        labels: { service: feedback-service }
      - targets: ['host.docker.internal:8087']
        labels: { service: analytics-service }

  # Exporter MySQL/Redis (Bảo - Sprint 5): chạy trong cùng mạng Docker nên gọi bằng tên service.
  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels: { service: mysql }

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: { service: redis }
