# Smart Heritage - Docker Compose (Bảo - Sprint 4)
#
# Cách dùng (chạy ở thư mục gốc repo):
#   docker compose -f Infra/docker-compose.yml up -d                       -> chỉ MySQL + Redis (như tuần 1-3)
#   docker compose -f Infra/docker-compose.yml --profile core up -d --build -> + Backend cũ, Gateway, auth/site/content/feedback-service
#   docker compose -f Infra/docker-compose.yml --profile mq up -d          -> + RabbitMQ
#   docker compose -f Infra/docker-compose.yml --profile monitoring up -d  -> + Prometheus, Grafana, exporter MySQL/Redis
#     Kiểm tra nhanh: powershell -ExecutionPolicy Bypass -File Infra/monitoring/smoke-test.ps1 (Bảo - Sprint 5)
#   docker compose -f Infra/docker-compose.yml --profile nifi up -d        -> + Apache NiFi (Tuấn)
# Bật nhiều profile: --profile core --profile monitoring
#
# Lưu ý: profile core chiếm cổng 8080/8081/8082/8083/8086/8090. Nếu đang chạy Gateway/service/Backend bằng
# mvn spring-boot:run thì KHÔNG bật profile core (trùng cổng).
# Mật khẩu, khóa JWT: copy Infra/.env.example thành Infra/.env rồi sửa.
# Database (Tường - Sprint 4): MySQL chạy mọi script trong Infra/db theo thứ tự tên file
# (00 tạo 7 schema + user riêng, 01..07 từng schema, 99 là smart_heritage_db của Backend cũ).
# Script chỉ chạy khi volume trống; sửa Infra/db thì chạy lại: down -v rồi up -d (xem Infra/db/README.md).

services:
  # ---------- Luôn chạy (không gắn profile) ----------
  mysql-db:
    image: mysql:8.0
    container_name: smart_heritage_mysql
    restart: always
    environment:
      MYSQL_DATABASE: smart_heritage_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7.2-alpine
    container_name: smart_heritage_redis
    restart: always
    ports:
      - "6379:6379"

  # ---------- profile: core ----------
  backend:
    profiles: ["core"]
    build:
      context: ../Backend
    container_name: smart_heritage_backend
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/smart_heritage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      SPRING_DATA_REDIS_HOST: redis-cache
      JWT_SECRET: ${JWT_SECRET:-smart-heritage-dev-secret-key-change-me-0123456789abcdef}
    ports:
      - "8090:8090"
    depends_on:
      mysql-db:
        condition: service_healthy

  auth-service:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: smart_heritage_auth
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql-db:3306/smart_heritage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      AUTH_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      JWT_SECRET: ${JWT_SECRET:-smart-heritage-dev-secret-key-change-me-0123456789abcdef}
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy

  content-service:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: services/content-service/Dockerfile
    container_name: smart_heritage_content
    volumes:
      - content_uploads:/app/uploads
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/content_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      # Chưa có site-service thì kiểm tra siteId qua Backend cũ
      LEGACY_BACKEND_URL: http://backend:8090
    ports:
      - "8083:8083"
    depends_on:
      mysql-db:
        condition: service_healthy

  site-service:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: services/site-service/Dockerfile
    container_name: smart_heritage_site
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/site_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy

  # Tường - Task 5: đánh giá hiện vật, dùng user riêng feedback_user (Infra/db/00_create_schemas.sql)
  feedback-service:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: services/feedback-service/Dockerfile
    container_name: smart_heritage_feedback
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/feedback_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: feedback_user
      DB_PASSWORD: ${FEEDBACK_DB_PASSWORD:-feedback_pass_dev}
      # Kiểm tra hiện vật tồn tại + ACTIVE; lấy tên người gửi qua /api/auth/me
      CONTENT_SERVICE_URL: http://content-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8086:8086"
    depends_on:
      mysql-db:
        condition: service_healthy
      content-service:
        condition: service_started
      auth-service:
        condition: service_started

  api-gateway:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: smart_heritage_gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-smart-heritage-dev-secret-key-change-me-0123456789abcdef}
      AUTH_SERVICE_URL: http://auth-service:8081
      LEGACY_BACKEND_URL: http://backend:8090
      CONTENT_SERVICE_URL: http://content-service:8083
      SITE_SERVICE_URL: http://site-service:8082
      FEEDBACK_SERVICE_URL: http://feedback-service:8086
      # Tách xong service nào thì thêm 1 dòng ở trên
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - content-service
      - site-service
      - feedback-service
      - backend

  # ---------- profile: mq ----------
  rabbitmq:
    profiles: ["mq"]
    image: rabbitmq:3.13-management
    container_name: smart_heritage_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartheritage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-rabbit}
    ports:
      - "5672:5672"     # AMQP cho service
      - "15672:15672"   # giao diện quản trị

  # ---------- profile: monitoring ----------
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: smart_heritage_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # cần trên Linux; Windows/Mac đã có sẵn
    ports:
      - "9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: smart_heritage_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Exporter (Bảo - Sprint 5): đổi chỉ số MySQL/Redis sang dạng Prometheus đọc được.
  # Dev dùng tài khoản root của MySQL (chỉ đọc chỉ số); môi trường thật nên tạo user riêng quyền PROCESS, REPLICATION CLIENT, SELECT.
  mysql-exporter:
    profiles: ["monitoring"]
    image: prom/mysqld-exporter:v0.15.1
    container_name: smart_heritage_mysql_exporter
    command:
      - --mysqld.address=mysql-db:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
    ports:
      - "9104:9104"     # http://localhost:9104/metrics
    depends_on:
      mysql-db:
        condition: service_healthy

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.62.0
    container_name: smart_heritage_redis_exporter
    environment:
      REDIS_ADDR: redis://redis-cache:6379
    ports:
      - "9121:9121"     # http://localhost:9121/metrics
    depends_on:
      - redis-cache

  # ---------- profile: nifi (Tuấn gắn luồng) ----------
  nifi:
    profiles: ["nifi"]
    image: apache/nifi:1.28.1
    container_name: smart_heritage_nifi
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-change-me-nifi-123}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - ./nifi/drivers:/opt/nifi/nifi-current/drivers
      # Giữ flow/cấu hình NiFi khi chạy docker compose down (chỉ mất khi down -v)
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
    ports:
      - "8443:8443"     # https://localhost:8443/nifi
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  content_uploads:
  mysql_data:
  grafana_data:
  nifi_conf:
  nifi_state:
