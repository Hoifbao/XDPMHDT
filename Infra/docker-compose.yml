services:
  mysql-db:
    image: mysql:8.0
    container_name: smart_heritage_mysql
    restart: always
    environment:
      MYSQL_DATABASE: smart_heritage_db
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - ./services-databases.sql:/docker-entrypoint-initdb.d/services-databases.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 30

  site-service:
    build:
      context: ..
      dockerfile: Infra/Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: site-service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/site_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy

  content-service:
    build: ../Backend/content-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/content_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SITE_SERVICE_URL: http://site-service:8082
    ports:
      - "8083:8083"
    depends_on:
      mysql-db:
        condition: service_healthy
      site-service:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../WebAdmin:/usr/share/nginx/html:ro
    depends_on:
      - content-service
      - site-service

  redis-cache:
    image: redis:7.2-alpine
    container_name: smart_heritage_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
