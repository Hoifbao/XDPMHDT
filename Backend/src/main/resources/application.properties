spring.application.name=smart-heritage-backend
server.port=${SERVER_PORT:8080}

# Kết nối MySQL chạy trên Docker (Infra/docker-compose.yml, cổng 3307).
# Có thể ghi đè bằng biến môi trường (xem .env.example).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/smart_heritage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo/cập nhật bảng từ các class @Entity của nhóm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (Phú dùng cho demo cache)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Báo lỗi nhanh nếu Redis chưa chạy (mặc định chờ 60 giây)
spring.data.redis.timeout=2s

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (Bảo - Sprint 3). Khóa bí mật phải dài tối thiểu 32 ký tự.
# Khi deploy thật: đặt biến môi trường JWT_SECRET, không dùng giá trị mặc định này.
app.jwt.secret=${JWT_SECRET:smart-heritage-dev-secret-key-change-me-0123456789abcdef}
# Access token sống 15 phút, refresh token sống 7 ngày
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL:604800}
