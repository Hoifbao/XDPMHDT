spring.application.name=smart-heritage-backend
server.port=${SERVER_PORT:8080}

# Kết nối MySQL chạy trên Docker (Infra/docker-compose.yml, cổng 3307).
# Có thể ghi đè bằng biến môi trường (xem .env.example).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/smart_heritage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo/cập nhật bảng từ các class @Entity của nhóm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (Phú dùng cho demo cache)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Báo lỗi nhanh nếu Redis chưa chạy (mặc định chờ 60 giây)
spring.data.redis.timeout=2s

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# LOCAL DEMO ONLY. Never enable in production; production must use the authenticated principal/JWT.
app.personalization.allow-dev-user-header=${PERSONALIZATION_ALLOW_DEV_USER_HEADER:false}

# Demo endpoints are disabled unless explicitly enabled for local testing.
app.redis-demo.enabled=${REDIS_DEMO_ENABLED:false}
app.redis-demo.default-ttl-seconds=600
