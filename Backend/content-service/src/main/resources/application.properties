spring.application.name=content-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/content_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
services.site.url=${SITE_SERVICE_URL:http://localhost:8082}
