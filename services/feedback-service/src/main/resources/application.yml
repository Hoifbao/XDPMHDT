# feedback-service (Tường - Sprint 5). Chạy: mvn -pl services/feedback-service spring-boot:run
# Tuần 5: Gateway (8080) chuyển /api/artifacts/*/feedbacks, /api/artifacts/*/rating-summary, /api/admin/feedbacks/** về đây.
# Test trực tiếp ở http://localhost:8086 (tự gắn header X-User-Id, X-User-Role như Gateway).
server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: feedback-service
  datasource:
    # Schema feedback_db do Infra/db/06_feedback.sql tạo. User riêng: DB_USERNAME=feedback_user, DB_PASSWORD=feedback_pass_dev
    url: "${DB_URL:jdbc:mysql://localhost:3307/feedback_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  # Tuần 6: RabbitMQ. Service không có Spring profile riêng, luôn gửi sự kiện; container rabbitmq
  # bật bằng docker compose --profile mq. Mặc định khớp Infra/docker-compose.yml.
  # connection-timeout ngắn để RabbitMQ tắt thì API gửi/duyệt đánh giá không bị treo lâu.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartheritage}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-rabbit}
    connection-timeout: 2s

# Gọi service khác (timeout 2 giây)
app:
  clients:
    # Kiểm tra hiện vật tồn tại + ACTIVE qua content-service (GET /api/artifacts/{id} trả data.status)
    content-url: ${CONTENT_SERVICE_URL:http://localhost:8083}
    # Lấy tên hiển thị (fullName) của người gửi đánh giá qua /api/auth/me
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    timeout: ${CLIENT_TIMEOUT:2s}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Giám sát (Prometheus đọc /actuator/prometheus) - giữ nguyên
management:
  # RabbitMQ tắt không làm service bị coi là DOWN: gửi sự kiện lỗi chỉ ghi log, API vẫn chạy.
  # Đổi lại /actuator/health không phản ánh RabbitMQ: theo dõi qua metric feedback_events_published_total{result="failed"}.
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Cần cho biểu đồ/cảnh báo độ trễ p95 trên Grafana (histogram_quantile)
      percentiles-histogram:
        http.server.requests: true
