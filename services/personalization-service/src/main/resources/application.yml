server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: personalization-service
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/personalization_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  clients:
    # Có thể trỏ 8083 (content-service) hoặc 8090 (Backend cũ) khi chạy chuyển tiếp.
    content-url: ${CONTENT_SERVICE_URL:http://localhost:8083}
    timeout: ${CLIENT_TIMEOUT:2s}
  redis-demo:
    enabled: ${REDIS_DEMO_ENABLED:false}
    default-ttl-seconds: ${REDIS_DEMO_TTL:600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
