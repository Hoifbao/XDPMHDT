# content-service (Xuân Anh - Sprint 4): hiện vật, nội dung đa ngôn ngữ, media.
# Client gọi qua Gateway http://localhost:8080; chạy riêng ở cổng 8083 để test Swagger/Actuator.
server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: content-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartheritage}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-rabbit}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    # Bảng tạo bởi Infra/db/03_content.sql (Tường); ddl-auto update để chạy thử khi chưa có script
    url: "${DB_URL:jdbc:mysql://localhost:3307/content_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

# Gọi site-service để kiểm tra siteId và lấy tên di tích.
# Chưa có site-service (Ân) thì mặc định gọi Backend cũ 8090 (cùng API GET /api/heritage-sites/{id}).
app:
  events:
    confirm-timeout-ms: 5000
  media:
    directory: ${MEDIA_DIRECTORY:./uploads}
  clients:
    site-url: ${SITE_SERVICE_URL:${LEGACY_BACKEND_URL:http://localhost:8090}}
    timeout: ${CLIENT_TIMEOUT:2s}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Giám sát (Prometheus đọc /actuator/prometheus) - giữ nguyên
management:
  # Broker outages leave durable outbox entries pending; the content API can still serve requests.
  # Monitor sh_events_published_total{result="failed"} for delivery failures.
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Cần cho biểu đồ/cảnh báo độ trễ p95 trên Grafana (histogram_quantile)
      percentiles-histogram:
        http.server.requests: true
