# beacon-service (Khoa - Sprint 4): iBeacon CRUD, registry quét BLE, gán hiện vật.
# Client gọi qua Gateway http://localhost:8080; chạy riêng ở cổng 8084 để test Swagger/Actuator.
server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: beacon-service
  datasource:
    # Bảng tạo bởi Infra/db/04_beacon.sql (Tường); ddl-auto update để chạy thử khi chưa có script
    url: "${DB_URL:jdbc:mysql://localhost:3307/beacon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  # Khoa W6: nhận sự kiện RabbitMQ (routing key feedback.approved từ exchange sh.events).
  # Service không có Spring profile riêng, luôn chạy listener; container rabbitmq bật bằng
  # docker compose --profile mq. Mặc định khớp Infra/docker-compose.yml.
  # RabbitMQ tắt -> listener thử kết nối lại (không làm service chết); API vẫn chạy bình thường.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartheritage}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-rabbit}
    connection-timeout: 2s
    listener:
      simple:
        # Lỗi xử lý tối đa 3 lần rồi bỏ (default-requeue-rejected=false) -> vào dead-letter
        # queue notification.feedback-approved.dlq thay vì quay lại queue vô hạn.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
        default-requeue-rejected: false

# Kiểm tra dữ liệu ở service khác thay cho quan hệ FK (bảng gốc nằm ở site_db, content_db):
#  - siteId    -> site-service  (GET /api/heritage-sites/{id})
#  - artifactId -> content-service (GET /api/artifacts/{id})
# Service nào chưa chạy thì mặc định gọi Backend cũ 8090 (cùng API).
app:
  clients:
    site-url: ${SITE_SERVICE_URL:${LEGACY_BACKEND_URL:http://localhost:8090}}
    content-url: ${CONTENT_SERVICE_URL:${LEGACY_BACKEND_URL:http://localhost:8090}}
    timeout: ${CLIENT_TIMEOUT:2s}
  # Khoa W5: module notification. Đường dẫn tới service account JSON của Firebase Console
  # (file này KHÔNG commit - để ở thư mục ngoài repo, ví dụ C:\secrets\beacon-service-account.json).
  # Thiếu cấu hình -> service vẫn chạy, chỉ bỏ qua gửi FCM và ghi log nhắc.
  fcm:
    service-account-file: ${FIREBASE_SERVICE_ACCOUNT:}
  # Khoa W6: tác vụ quét pin beacon -> beacon.battery.low. Mặc định 15 phút (task_w6_chi_tiet).
  # Demo muốn thấy ngay: gọi POST /api/ibeacons/battery-check (ADMIN). Tắt: enabled=false.
  beacon:
    battery-check:
      enabled: ${BEACON_BATTERY_CHECK_ENABLED:true}
      interval-ms: ${BEACON_BATTERY_CHECK_INTERVAL_MS:900000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Giám sát (Prometheus đọc /actuator/prometheus) - giữ nguyên
management:
  # RabbitMQ tắt không làm service bị coi là DOWN (giống feedback-service):
  # sự kiện chưa nhận được sẽ thấy qua queue tích trên RabbitMQ UI / Grafana.
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
