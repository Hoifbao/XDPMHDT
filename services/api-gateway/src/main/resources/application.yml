# api-gateway (Bảo - Sprint 4). Chạy: mvn -pl services/api-gateway spring-boot:run
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

app:
  # Phải TRÙNG khóa với auth-service và Backend cũ (cùng biến môi trường JWT_SECRET)
  jwt:
    secret: ${JWT_SECRET:smart-heritage-dev-secret-key-change-me-0123456789abcdef}
  # Địa chỉ các service. Service chưa tách -> trỏ về Backend cũ (LEGACY_BACKEND_URL, cổng 8090).
  # Tách xong service nào thì đặt biến môi trường tương ứng, hoặc sửa giá trị mặc định ở đây.
  routes:
    legacy: ${LEGACY_BACKEND_URL:http://localhost:8090}
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    site: ${SITE_SERVICE_URL:http://localhost:8082}
    content: ${CONTENT_SERVICE_URL:http://localhost:8083}
    beacon: ${BEACON_SERVICE_URL:${LEGACY_BACKEND_URL:http://localhost:8090}}
    personalization: ${PERSONALIZATION_SERVICE_URL:http://localhost:8085}
    feedback: ${FEEDBACK_SERVICE_URL:http://localhost:8086}
    analytics: ${ANALYTICS_SERVICE_URL:${LEGACY_BACKEND_URL:http://localhost:8090}}

# Bảo W5: Swagger chung tại http://localhost:8080/swagger-ui.html (ô "Select a definition" chọn service).
# Mỗi mục đọc /v3/api-docs/<tên> -> Gateway chuyển tới /v3/api-docs của service đó (GatewayRoutesConfig).
# Service đang tắt -> mục đó báo "Failed to load API definition", các mục khác vẫn dùng được.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: auth-service
    urls:
      - name: auth-service
        url: /v3/api-docs/auth
      - name: site-service
        url: /v3/api-docs/site
      - name: content-service
        url: /v3/api-docs/content
      - name: beacon-service
        url: /v3/api-docs/beacon
      - name: personalization-service
        url: /v3/api-docs/personalization
      - name: feedback-service
        url: /v3/api-docs/feedback
      - name: analytics-service
        url: /v3/api-docs/analytics
      - name: backend-cu (8090)
        url: /v3/api-docs/legacy
    # Giữ token sau khi bấm Authorize, kể cả khi đổi service hoặc tải lại trang
    persist-authorization: true
    display-request-duration: true

# Giám sát: http://localhost:8080/actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Bảo W5: cần cho biểu đồ/cảnh báo độ trễ p95 trên Grafana (histogram_quantile)
      percentiles-histogram:
        http.server.requests: true
