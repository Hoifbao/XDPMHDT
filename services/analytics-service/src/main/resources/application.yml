# analytics-service (Tuấn - Sprint 5). Chạy: mvn -pl services/analytics-service spring-boot:run
# Gateway (8080) chuyển /api/statistics/** về đây khi đặt ANALYTICS_SERVICE_URL=http://localhost:8087 (chỉ ADMIN).
server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: analytics-service
  datasource:
    # Schema analytics_db do Infra/db/07_analytics.sql tạo, NiFi đổ dữ liệu vào.
    # User riêng: DB_USERNAME=analytics_user, DB_PASSWORD=analytics_pass_dev
    url: "${DB_URL:jdbc:mysql://localhost:3307/analytics_db?useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Không có entity; bảng do script SQL quản lý, service chỉ đọc
      ddl-auto: none
    open-in-view: false
    show-sql: false
  # Tuần 6: nhận visit.recorded, feedback.created từ exchange sh.events (cần --profile mq)
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartheritage}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-rabbit}
    connection-timeout: 2s
    listener:
      simple:
        # Xử lý lỗi 3 lần thì chuyển tin vào analytics.dlq, không requeue vô hạn
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Giám sát (Prometheus đọc /actuator/prometheus) - giữ nguyên
management:
  # Giống feedback-service: RabbitMQ chết không làm /actuator/health DOWN (API thống kê vẫn chạy)
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Cần cho biểu đồ độ trễ p95 trên Grafana (giống content-service, feedback-service)
      percentiles-histogram:
        http.server.requests: true
